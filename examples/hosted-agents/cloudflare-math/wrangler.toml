# Cloudflare Workers configuration for the A2A math agent.
#
# Replace `name` if you'd like a different subdomain. After
# `wrangler deploy`, your agent will be live at
# https://<name>.<your-cloudflare-subdomain>.workers.dev/.
#
# The GROQ_API_KEY secret must be set before deployment:
#   wrangler secret put GROQ_API_KEY
#
# Optional: pin a different Groq model via the GROQ_MODEL var below.
# Free-tier-eligible Groq models include:
#   - llama-3.3-70b-versatile      (default, accurate, ~30 req/min)
#   - llama-3.1-8b-instant         (faster, smaller, higher rate)
#   - llama-3.1-70b-versatile      (legacy, may be deprecated)

name = "a2a-math-agent"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Disable the default `*.workers.dev` route. Hosting on a zone you
# control unlocks WAF rules, zone-level rate limits, and transform
# rules that don't apply on `*.workers.dev`. Replace the route
# below with your own hostname (or remove the [[routes]] block to
# use the default workers.dev URL).
workers_dev = false

[[routes]]
pattern = "math.a2a-testbed.com"
custom_domain = true

[vars]
GROQ_MODEL = "llama-3.3-70b-versatile"

[observability]
enabled = true

# Per-IP rate limit binding. Tune `simple` to fit your usage:
#   key:    `cf-connecting-ip` of the requester (set by Cloudflare).
#   limit:  number of requests allowed in the window.
#   period: 10 or 60 (seconds) — the only values the binding accepts.
[[unsafe.bindings]]
name = "MATH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
