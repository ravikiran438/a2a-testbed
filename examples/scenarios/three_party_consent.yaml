# Three-party guardian-mediated consent scenario.
#
# Three Python in-process agents walk a multi-protocol flow. The
# scenario runner enforces the HTTP expectations on every step.
# Extension semantics (checked on each protocol's MCP server) are
# shown in extension_checks.yaml, which needs those servers installed;
# this scenario runs anywhere.

name: "Three-party guardian-mediated consent"
description: |
  GroceryHelper requests consent to deliver groceries. The request is routed
  through Alice's guardian Bob. After consent is granted, the delivery
  proceeds with PACE-adapted interaction ((unspecified language), voice-first), NERVE
  behavioral fingerprint verification, and a Phala welfare feedback emission.

mode: sim

agents:
  - id: alice
    card: ../agent-cards/three-party/alice.json
    runtime: python_inproc
    role: principal
  - id: bob
    card: ../agent-cards/three-party/bob.json
    runtime: python_inproc
    role: guardian
  - id: carol
    card: ../agent-cards/three-party/carol.json
    runtime: python_inproc
    role: service_provider

flow:
  - from: carol
    to: alice
    action: request_consent
    message: "request_consent: deliver groceries today"
    expect:
      response_status: "2xx"

  - from: alice
    to: bob
    action: forward_consent_request
    message: "forward_consent_request: GroceryHelper wants to deliver"
    expect:
      response_status: "2xx"

  - from: bob
    to: carol
    action: grant_consent
    message: "grant_consent: approved, delivery permitted"
    expect:
      response_status: "2xx"

  - from: carol
    to: alice
    action: deliver
    message: "deliver: groceries on the way"
    expect:
      response_status: "2xx"

  - from: alice
    to: carol
    action: feedback
    message: "feedback: welfare positive, dignity preserved"
    expect:
      response_status: "2xx"

reports:
  - format: json
    path: reports/three_party_consent.json
  - format: markdown
    path: reports/three_party_consent.md
  - format: svg-badge
    path: reports/three_party_consent.svg
