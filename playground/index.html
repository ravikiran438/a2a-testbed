      name="twitter:image"
      content="https://a2a-testbed.com/a2a-logo/a2a-testbed-icon-192.png"
    />
    <!-- Structured data: tells search engines this is a free, browser-based
         developer tool for the A2A protocol. Schema.org SoftwareApplication
         is the right type for a hosted webapp; WebSite gives the canonical
         URL/name pair search engines use for sitelinks. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://a2a-testbed.com/#website",
            "url": "https://a2a-testbed.com/",
            "name": "a2a-testbed",
            "description": "In-browser playground for testing A2A multi-agent networks, validating AgentCards and Agent Control Specification (ACS) manifests, applying ACS runtime governance, and exercising live LLM-backed A2A agents.",
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "name": "a2a-testbed",
            "url": "https://a2a-testbed.com/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any (browser)",
            "description": "Polyglot multi-agent testbed for the A2A protocol. Run scripted scenarios across Python, Go, Node.js, and Java agents; validate AgentCards and Agent Control Specification (ACS) manifests; apply ACS runtime governance (allow/warn/deny/escalate) with fail-closed enforcement; drive real LLM-backed agents from the browser with full expectation enforcement.",
            "featureList": [
              "Multi-agent A2A scenario runner",
              "A2A 1.0 conformance contracts with spec citations",
              "AgentCard and extension-manifest validation",
              "Agent Control Specification (ACS) manifest validation",
              "ACS runtime governance with fail-closed enforcement",
              "Polyglot agents: Python, Go, Node.js, Java",
              "Fault injection and virtual time control"
            ],
            "keywords": "A2A, Agent2Agent, AgentCard, Agent Control Specification, ACS, agent governance, conformance testing, multi-agent, MCP",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "license": "https://www.apache.org/licenses/LICENSE-2.0",
            "codeRepository": "https://github.com/ravikiran438/a2a-testbed",
            "sameAs": "https://github.com/ravikiran438/a2a-testbed",
            "isBasedOn": [
              "https://a2a-protocol.org/",
              "https://github.com/microsoft/agent-governance-toolkit/blob/main/policy-engine/spec/SPECIFICATION.md",
              "https://github.com/microsoft/agent-governance-toolkit",
              "https://github.com/microsoft/ASSERT",
              "https://modelcontextprotocol.io/"
            ]
          }
        ]
      }
    </script>
    <title>a2a-testbed — test A2A agent networks before you ship them</title>
